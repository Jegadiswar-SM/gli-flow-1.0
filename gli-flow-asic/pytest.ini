[pytest]
testpaths = tests
python_files = test_*.py
addopts = -ra --timeout=60
markers =
    e2e: mock end-to-end pipeline tests
    integration: integration tests that may require external tools
    requires_tools: requires real EDA tools (sv2v, yosys, openroad, magic, netgen, klayout)
    requires_functional_magic: requires a functional Magic binary and magicdnull
    requires_network: requires outbound network access
    requires_writable_home: requires a writable $HOME directory
    requires_system_mutation: runs real installs via sudo/apt/npm and mutates the host
    requires_db_data: requires a populated failure-atlas database
